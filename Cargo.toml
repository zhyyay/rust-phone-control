[package]
name = "rust-phone-control"
version = "0.1.0"
edition = "2024"
default-run = "phone-desktop"

[[bin]]
name = "phone-desktop"
path = "src/main.rs"

[[bin]]
name = "ictrl-probe"
path = "src/bin/ictrl_probe.rs"

[[bin]]
name = "ble-probe"
path = "src/bin/ble_probe.rs"

[dependencies]
anyhow = "1"
aes = "0.8"
gpui-kit = "0.10.0"
mdns-sd = { path = "vendor/mdns-sd" }
chacha20poly1305 = "0.10"
hkdf = "0.12"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
subtle = "2"
zeroize = "1"
sha2 = "0.10"
rand = "0.8"
num-traits = "0.2"
num-bigint = "0.4"
crypto-bigint = { version = "0.7.11", default-features = false, features = ["zeroize"] }
plist = "1.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "io-util", "io-std"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1

[target.'cfg(windows)'.dependencies]
windows_062 = { package = "windows", version = "0.62.2", features = ["Foundation", "Devices_Bluetooth", "Devices_Bluetooth_GenericAttributeProfile", "Storage_Streams", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_NetworkManagement_Dns", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi"] }
